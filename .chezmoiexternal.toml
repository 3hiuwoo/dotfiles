# Each plugin's README documents a manual `git clone` install. chezmoi clones
# missing plugins and fast-forwards them at most daily; local commits or edits
# stop the pull instead of being overwritten. Completions and Vim wrappers that
# ship with a CLI tool (Eza, fzf) come from that tool's installation instead.

[".zsh/fsh"]
    type = "git-repo"
    url = "https://github.com/zdharma-continuum/fast-syntax-highlighting"
    refreshPeriod = "24h"
    pull.args = ["--ff-only"]

[".zsh/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions"
    refreshPeriod = "24h"
    pull.args = ["--ff-only"]

[".zsh/plugins/zsh-completions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-completions.git"
    refreshPeriod = "24h"
    pull.args = ["--ff-only"]

[".zsh/plugins/zsh-history-substring-search"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-history-substring-search"
    refreshPeriod = "24h"
    pull.args = ["--ff-only"]
