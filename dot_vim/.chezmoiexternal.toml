# Follow upstream default branches; refresh cached downloads daily on apply.
# Installed plugin files are owned by chezmoi externals.
# Preserve existing Git checkouts and locally generated files.

["pack/vendor/start/ack"]
    type = "archive"
    url = "https://codeload.github.com/mileszs/ack.vim/tar.gz/refs/heads/master"
    refreshPeriod = "24h"
    stripComponents = 1
    exact = false
    exclude = ["*/.github/**", "*/test/**", "*/tests/**", "*/screenshots/**", "*/images/**"]

