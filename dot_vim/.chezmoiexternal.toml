# Each plugin's README recommends cloning it into a Vim 8 package directory.
# chezmoi clones missing plugins and fast-forwards them at most daily; local
# commits or edits stop the pull instead of being overwritten.

["pack/vendor/start/ack"]
    type = "git-repo"
    url = "https://github.com/mileszs/ack.vim.git"
    refreshPeriod = "24h"
    pull.args = ["--ff-only"]

